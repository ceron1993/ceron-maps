# Compila el APK de Cerón Maps con todos los archivos de la app adentro.
# Se ejecuta solo cada vez que subes cambios a la rama main, o a mano desde la pestaña "Actions".
# Los servidores de GitHub ya traen el SDK de Android instalado.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar la clave de firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Falta el secreto KEYSTORE_PASSWORD. Agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar dependencias y copiar la app web
        run: |
          npm ci
          npx cap sync android

      - name: Compilar APK firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../CeronMaps-v1.${{ github.run_number }}.apk

      - name: Guardar el APK en la pestaña Actions
        uses: actions/upload-artifact@v4
        with:
          name: CeronMaps-APK
          path: CeronMaps-v1.${{ github.run_number }}.apk

      - name: Publicar el APK como Release (para descargarlo fácil desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cerón Maps v1.${{ github.run_number }}
          body: |
            APK de Cerón Maps. Descárgalo en el celular y ábrelo para instalar o actualizar.
            Las actualizaciones se instalan encima de la versión anterior sin borrar tus datos.
          files: CeronMaps-v1.${{ github.run_number }}.apk
